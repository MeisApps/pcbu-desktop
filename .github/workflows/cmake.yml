name: CMake
on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  QT_VERSION: 6.10.2

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Qt x64
        uses: jurplel/install-qt-action@v4
        with:
          dir: "C:/"
          version: "${{env.QT_VERSION}}"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2022_64"
          cache: "true"
          cache-key-prefix: "qt-x64"

      - name: Checkout vcpkg
        uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          path: vcpkg
          fetch-depth: 1

      - name: Resolve vcpkg revision
        id: vcpkg-rev
        shell: bash
        run: echo "sha=$(git -C vcpkg rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache vcpkg binaries x64
        uses: actions/cache@v4
        with:
          path: ${{runner.temp}}/vcpkg_cache
          key: "${{runner.os}}-x64-vcpkg-${{steps.vcpkg-rev.outputs.sha}}-${{hashFiles('cmake/vcpkg-triplets/*.cmake')}}-openssl"
          restore-keys: "${{runner.os}}-x64-vcpkg-"

      - name: Bootstrap vcpkg
        shell: cmd
        working-directory: vcpkg
        run: bootstrap-vcpkg.bat

      - name: vcpkg build x64
        shell: bash
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{runner.temp}}/vcpkg_cache
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          ./vcpkg/vcpkg.exe install --overlay-triplets=cmake/vcpkg-triplets --triplet x64-windows-static openssl
          ./vcpkg/vcpkg.exe install --overlay-triplets=cmake/vcpkg-triplets --triplet x64-windows-static-md openssl

      - name: Build x64
        run: bash -c "cd pkg && chmod +x build-desktop.sh && ARCH=x64 QT_BASE_DIR=C:/Qt/${{env.QT_VERSION}} ./build-desktop.sh"
        env:
          VCPKG_ROOT: ${{github.workspace}}/vcpkg

      - name: Upload x64
        uses: softprops/action-gh-release@v3
        with:
          files: |
            pkg/build/PulseUnlock-Setup-x64.exe

  build-windows-arm64:
    runs-on: windows-11-vs2026-arm
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Workaround Qt install bug
        shell: pwsh
        run: |
          $target = "C:\Qt\${{env.QT_VERSION}}\msvc2022_arm64\bin"
          New-Item -Path $target -ItemType Directory -Force | Out-Null
          Set-Location $target

          # qmake.bat
          @"
          @echo off
          \Users\qt\work\install\bin\qmake6.exe -qtconf "%~dp0\target_qt.conf" %*  
          "@ | Out-File -FilePath "qmake.bat" -Encoding ascii -Force

          # qmake6.bat
          @"
          @echo off
          \Users\qt\work\install\bin\qmake6.exe -qtconf "%~dp0\target_qt.conf" %*
          "@ | Out-File -FilePath "qmake6.bat" -Encoding ascii -Force

          # qtpaths.bat
          @"
          @echo off
          \Users\qt\work\install\bin\qtpaths6.exe -qtconf "%~dp0\target_qt.conf" %*
          "@ | Out-File -FilePath "qtpaths.bat" -Encoding ascii -Force

          # qtpaths6.bat
          @"
          @echo off
          \Users\qt\work\install\bin\qtpaths6.exe -qtconf "%~dp0\target_qt.conf" %*
          "@ | Out-File -FilePath "qtpaths6.bat" -Encoding ascii -Force

      - name: Install Qt arm64
        uses: jurplel/install-qt-action@v4
        with:
          dir: "C:/"
          version: "${{env.QT_VERSION}}"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2022_arm64_cross_compiled"
          cache: "true"
          cache-key-prefix: "qt-arm64"

      - name: Checkout vcpkg
        uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          path: vcpkg
          fetch-depth: 1

      - name: Resolve vcpkg revision
        id: vcpkg-rev
        shell: bash
        run: echo "sha=$(git -C vcpkg rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache vcpkg binaries arm64
        uses: actions/cache@v4
        with:
          path: ${{runner.temp}}/vcpkg_cache
          key: "${{runner.os}}-arm64-vcpkg-${{steps.vcpkg-rev.outputs.sha}}-${{hashFiles('cmake/vcpkg-triplets/*.cmake')}}-openssl"
          restore-keys: "${{runner.os}}-arm64-vcpkg-"

      - name: Bootstrap vcpkg
        shell: cmd
        working-directory: vcpkg
        run: bootstrap-vcpkg.bat

      - name: vcpkg build arm64
        shell: bash
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{runner.temp}}/vcpkg_cache
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          ./vcpkg/vcpkg.exe install --overlay-triplets=cmake/vcpkg-triplets --triplet arm64-windows-static openssl
          ./vcpkg/vcpkg.exe install --overlay-triplets=cmake/vcpkg-triplets --triplet arm64-windows-static-md openssl

      - name: Build arm64
        run: bash -c "cd pkg && rm -Rf ./build/ && ARCH=arm64 QT_BASE_DIR=C:/Qt/${{env.QT_VERSION}} ./build-desktop.sh"
        env:
          VCPKG_ROOT: ${{github.workspace}}/vcpkg

      - name: Upload arm64
        uses: softprops/action-gh-release@v3
        with:
          files: |
            pkg/build/PulseUnlock-Setup-arm64.exe

  build-linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build docker
        run: bash -c "cd ${{github.workspace}}/pkg/linux && chmod +x docker-build.sh && ARCH=x64 ./docker-build.sh"

      - name: Upload
        uses: softprops/action-gh-release@v3
        with:
          files: |
            pkg/build/PulseUnlock-x64.AppImage

  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build docker
        run: bash -c "cd ${{github.workspace}}/pkg/linux && chmod +x docker-build.sh && ARCH=arm64 ./docker-build.sh"

      - name: Upload
        uses: softprops/action-gh-release@v3
        with:
          files: |
            pkg/build/PulseUnlock-arm64.AppImage

  build-mac-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Prepare Qt
        run: sudo chmod 777 /opt
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          dir: "/opt"
          version: "${{env.QT_VERSION}}"
          host: "mac"
          target: "desktop"
          arch: "clang_64"
          cache: "true"

      - name: Checkout vcpkg
        uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          path: vcpkg
          fetch-depth: 1

      - name: Resolve vcpkg revision
        id: vcpkg-rev
        run: echo "sha=$(git -C vcpkg rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache vcpkg binaries arm64
        uses: actions/cache@v4
        with:
          path: ${{runner.temp}}/vcpkg_cache
          key: "${{runner.os}}-arm64-vcpkg-${{steps.vcpkg-rev.outputs.sha}}-${{hashFiles('cmake/vcpkg-triplets/*.cmake')}}-openssl"
          restore-keys: "${{runner.os}}-arm64-vcpkg-"

      - name: Bootstrap vcpkg
        working-directory: vcpkg
        run: ./bootstrap-vcpkg.sh -disableMetrics

      - name: vcpkg build arm64
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{runner.temp}}/vcpkg_cache
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          ./vcpkg/vcpkg install --overlay-triplets=cmake/vcpkg-triplets --triplet arm64-osx-static openssl

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466
        with:
          keychain: signing_temp
          p12-file-base64: ${{secrets.MACOS_CERTIFICATE}}
          p12-password: ${{secrets.MACOS_CERTIFICATE_PASSWORD}}

      - name: Prepare signing
        env:
          MACOS_NOTARY_KEY: ${{secrets.MACOS_NOTARY_KEY}}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k signing_temp.keychain || true

          SIGN_IDENTITY="$(security find-identity -v -p codesigning signing_temp.keychain | grep "Developer ID Application" | head -n 1 | awk '{print $2}')"
          if [ -z "$SIGN_IDENTITY" ]; then
            echo "No Developer ID Application identity found."
            exit 1
          fi
          echo "MAC_SIGN_IDENTITY=$SIGN_IDENTITY" >> "$GITHUB_ENV"

          (umask 077 && echo "$MACOS_NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8")
          echo "MAC_NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      - name: Build
        run: bash -c "cd pkg && rm -Rf ./build/ && ARCH=arm64 QT_BASE_DIR=/opt/Qt/${{env.QT_VERSION}} CI_BUILD=1 ./build-desktop.sh"
        env:
          VCPKG_ROOT: ${{github.workspace}}/vcpkg
          MAC_NOTARY_KEY_ID: ${{secrets.MACOS_NOTARY_KEY_ID}}
          MAC_NOTARY_ISSUER_ID: ${{secrets.MACOS_NOTARY_ISSUER_ID}}

      - name: Lock signing
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security lock-keychain signing_temp.keychain || true

      - name: Upload
        uses: softprops/action-gh-release@v3
        with:
          files: |
            pkg/build/PulseUnlock-arm64.dmg
